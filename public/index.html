<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Plenzo 登录系统">
    <meta name="theme-color" content="#10b981">
    <title>登录 - Plenzo</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

    <!-- Styles -->
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
    <link rel="stylesheet" href="/css/core/global.css">

    <style>
        body {
            background-color: var(--color-gray-100);
            background-image:
                radial-gradient(at 0% 0%, var(--color-primary-200) 0px, transparent 50%),
                radial-gradient(at 100% 100%, var(--color-primary-100) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-left: 100px;
            padding-right: 100px;
        }

        /* ============================================
         * Mouse-follow Ink Blot Background Layer
         * ============================================ */
        #ink-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }

        .ink-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0;
            will-change: transform;
            transition: opacity 0.6s ease;
        }

        .ink-blob.loaded {
            opacity: 1;
        }

        .login-card {
            width: 380px;
            max-width: 1420px;
            /* 440px * 1.3 ≈ 570, but keep a little padding margin → 520px to stay usable */
            padding: 35px 45px;
            /* height reduced ~20% from 2.125rem → 1.6rem; side padding preserved */
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            border-radius: 18px;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 0;
        }

        .brand-icon {
            width: 65px;
            height: 65px;
            margin-bottom: 0;
            padding-top: 10px;
            object-fit: contain;
        }

        .brand-header h1 {
            font-size: var(--fs-700);
            /* slightly smaller heading */
            margin-bottom: 0.35rem;
        }

        .brand-header p {
            font-size: var(--fs-300);
            color: var(--color-gray-500);
            margin-bottom: 0;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 0.875rem;
            /* reduced gap between inputs */
        }

        .form-group {
            position: relative;
        }

        .form-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-gray-400);
            pointer-events: none;
            z-index: 10;
        }

        .form-options {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 0.875rem;
        }

        /* ============================================
         * Custom Checkbox — Figma-accurate style
         * ============================================ */
        .remember-me-label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            height: 30px;
            font-size: var(--fs-400);
            color: #334155;
            user-select: none;
            -webkit-user-select: none;
            margin-bottom: 0;
            padding-top: 20px;
            padding-bottom: 20px;
        }

        /* Hide native checkbox */
        .remember-me-label input[type="checkbox"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        /* Custom checkbox square */
        .remember-me-label .check-box {
            width: 18px;
            height: 18px;
            border: 2px solid #cbd5e1;
            /* slate-300 — empty state */
            border-radius: 4px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            background: #fff;
        }

        .remember-me-label .check-box svg {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: #fff;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.15s ease;
        }

        /* Checked state — filled green with checkmark */
        .remember-me-label input[type="checkbox"]:checked+.check-box {
            background: #10b981;
            border-color: #10b981;
        }

        .remember-me-label input[type="checkbox"]:checked+.check-box svg {
            opacity: 1;
            transform: scale(1);
        }

        .remember-me-label:hover .check-box {
            border-color: #10b981;
        }

        .remember-me-label input[type="checkbox"]:checked+.check-box:hover {
            background: #059669;
            border-color: #059669;
        }

        .login-footer {
            margin-top: 2rem;
            text-align: center;
            font-size: var(--fs-300);
            color: var(--color-gray-500);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        .login-footer .separator {
            color: var(--color-gray-400);
            font-size: var(--fs-300);
            opacity: 0.6;
        }

        .login-footer .brand-text {
            color: var(--color-gray-600);
            font-weight: 600;
        }

        /* 登录页局部调整：品牌区/输入框/logo */
        .login-card .brand-header h1 {
            font-size: var(--fs-700);
            margin-bottom: 0;
            padding-top: 0;
            padding-bottom: 0;
        }

        .login-card .brand-header p {
            font-size: var(--fs-400);
            padding-top: 10px;
            padding-bottom: 20px;
        }

        .login-card input.form-input,
        .login-card .custom-select-trigger {
            height: 45px;
        }
            
        /* 窄屏适配：body 左右各 100px 留白 + 卡片固定 380px，在 <580px 会横向溢出。
           这个溢出在加入底图之前就存在（已用 git 原始版验证），与底图无关。 */
        @media (max-width: 600px) {
            body {
                padding-left: 20px;
                padding-right: 20px;
            }

            .login-card {
                /* 不能写 width:100% —— #app 是 flex 项、宽度由内容撑开，
                   卡片百分比宽度会和它形成循环依赖，最后塌到内容的天然宽度（实测 291px）。
                   给一个显式宽度就没这个问题。 */
                width: min(380px, calc(100vw - 40px));
                padding: 28px 24px;
            }
        }
    
    
    
    
    
        /* >>> su-bg:start */
        /* ============================================
         * 苏堤淡彩底图（内联 SVG，非图片文件）
         *
         * 改配色 → 只动下面 --su-1..N 这几个变量
         * 改大小 → 动 --su-height / --su-opacity
         * 整层关掉 → .su-bg{display:none}
         * ============================================ */
        :root {
            --su-1: #dee2de;
            --su-2: #d9dcd8;
            --su-3: #d0dad2;
            --su-4: #ccd4cb;
            --su-5: #b7bfb2;
            --su-opacity: 0.9;
            /* .su-bg 底色 = 调色板的中间色。改色时 --su-1..N 改了，背景自动跟 —— 不会再脱节 */
            --su-bg-color: var(--su-3);
            /* 底图原始比例 1872:542 ≈ 3.45:1。带高按 42vh 给，
               在 1440 宽下约 378px —— 接近 417px 的「不裁切高度」，
               裁掉的只是顶部一点天空，桥和树都完整。 */
            --su-height: clamp(190px, 42vh, 470px);
        }

        .su-bg {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: var(--su-height);
            /* -2：压在 #ink-bg（-1）之下，两层都在内容之下 */
            z-index: -2;
            background: var(--su-bg-color);
            pointer-events: none;
            opacity: var(--su-opacity);
            /* 顶部渐隐，让它化进页面底色而不是一条硬边 */
            -webkit-mask-image: linear-gradient(to top, #000 0%, #000 74%, transparent 100%);
            mask-image: linear-gradient(to top, #000 0%, #000 74%, transparent 100%);
        }

        .su-bg svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        @media (max-width: 768px) {
            :root {
                --su-opacity: 0.78;
                --su-height: clamp(150px, 27vh, 260px);
            }
        }
        /* <<< su-bg:end */
    </style>
</head>

    <!-- Mouse-follow ink blot background -->
    <div id="ink-bg">
        <div class="ink-blob" id="ink-1" style="width:420px;height:420px;background:radial-gradient(circle,rgba(16,185,129,0.18) 0%,rgba(16,185,129,0.06) 50%,transparent 70%);"></div>
        <div class="ink-blob" id="ink-2" style="width:350px;height:350px;background:radial-gradient(circle,rgba(52,211,153,0.14) 0%,rgba(52,211,153,0.04) 50%,transparent 70%);"></div>
        <div class="ink-blob" id="ink-3" style="width:380px;height:380px;background:radial-gradient(circle,rgba(110,231,183,0.12) 0%,rgba(110,231,183,0.03) 50%,transparent 70%);"></div>
    </div>

    <div id="app" class="animate-fade-in">
        <div class="card login-card">
            <div class="brand-header">
                <img src="/assets/logo.svg" alt="Logo" class="brand-icon">
                <h1>欢迎回来</h1>
                <p>请登录您的账户以继续</p>
            </div>

            <div class="login-form">
                <div class="form-group">
                    <span class="material-icons-round form-icon">person</span>
                    <input type="text" id="username" class="form-input" placeholder="用户名" aria-label="用户名">
                </div>

                <div class="form-group">
                    <span class="material-icons-round form-icon">lock</span>
                    <input type="password" id="password" class="form-input" placeholder="密码" aria-label="密码">
                </div>

                <div class="form-group">
                    <span class="material-icons-round form-icon">badge</span>
                    <!-- Hidden native select for form data -->
                    <select id="userType" class="form-input" aria-label="用户类型" style="display: none;">
                        <option value="teacher" selected>教师</option>
                        <option value="student">学生</option>
                        <option value="admin">管理员</option>
                    </select>

                    <!-- Custom Dropdown Trigger -->
                    <div class="custom-select-wrapper">
                        <div class="custom-select-trigger form-input">
                            <span id="customSelectText">教师</span>
                            <span class="material-icons-round arrow">expand_more</span>
                        </div>
                        <div class="custom-options">
                            <div class="custom-option selected" data-value="teacher">教师</div>
                            <div class="custom-option" data-value="student">学生</div>
                            <div class="custom-option" data-value="admin">管理员</div>
                        </div>
                    </div>
                </div>
            </div>

            <button id="loginBtn" class="btn primary-btn"
                style="width: 100%; justify-content: center; height: 45px; padding: 12px; margin-top: 1.25rem; border-radius: 10px; font-size: var(--fs-300); font-weight: 600;">
                登录
            </button>

            <div class="form-options">
                <label class="remember-me-label">
                    <input type="checkbox" id="rememberMe">
                    <span class="check-box">
                        <svg viewBox="0 0 24 24">
                            <polyline points="4 12 10 18 20 6"></polyline>
                        </svg>
                    </span>
                    保持登录
                </label>
            </div>

            <div id="errorMessage" class="login-error" role="alert" style="display: none;">
                <svg class="login-error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span id="errorMessageText"></span>
            </div>
        </div>

        <div class="login-footer">
            <span class="brand-text">Plenzo</span>
            <span class="separator">|</span>
            <span class="copyright-text">&copy; <span id="copyrightYear">2007</span> 蔚蓝</span>
        </div>
    </div>
