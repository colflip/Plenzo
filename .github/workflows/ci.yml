name: CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    test:
        name: Test (Node ${{ matrix.node-version }})
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [18, 20, 22]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm
            - run: npm ci
            # 不加 --passWithNoTests：测试源码（tests/、**/__tests__/、jest.config.js）
            # 现在入库了，空集只可能是配置写错或文件被误删，那时候应该红而不是绿。
            - run: npm test
              env:
                  NODE_ENV: test
                  OFFLINE_DEV: true
                  JWT_SECRET: ci-test-secret-key-do-not-use-in-production
